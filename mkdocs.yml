
site_name: 我的个人网站

site_description: 个人知识库、学习笔记与技术教程

theme:
  name: material
  language: zh

  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: blue

nav:
  - 首页: index.md

  - 个人介绍: about.md

  - 学习笔记:
      - Python: learning/python.md
      - 人工智能: learning/ai.md
      - Markdown: learning/markdown.md

  - 技术教程:
      - MkDocs: tutorials/mkdocs.md
      - GitHub: tutorials/github.md
      - 网站开发: tutorials/web-development.md

  - 资源分享:
      - 常用网站: resources/websites.md
      - 工具推荐: resources/tools.md
