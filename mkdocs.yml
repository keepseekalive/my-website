site_name: 我的个人网站

site_description: 我的个人知识库和学习笔记

theme:
  name: material
  language: zh

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: blue

nav:
  - 首页: index.md

  - 关于我: about.md

  - 学习笔记:
      - Python 学习: notes.md

  - 技术教程:
      - MkDocs 建站: tutorials.md

  - 资源分享:
      - 常用网站: resources.md
